[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
    https://github.com/earlephilhower/ESP8266Audio.git#1.9.9
build_flags =
    -DCORE_DEBUG_LEVEL=3
